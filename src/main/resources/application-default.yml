# 注意,冒号后面有一个空格
modelUrl: http://localhost:8080/answer



mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启SQL日志
#  global-config:
#    db-config:
#      id-type: auto # 主键自增

jwt:
  secret: "your-256-bit-secret-your-256-bit-secret-your-256-bit-secret" # 至少32字符
  expiration: 86400 # token有效期(秒)，默认24小时
  cookie-name: "utoken" # cookie名称
#  cookie-domain: "example.com" # 可选，生产环境应设置
  cookie-secure: true # 生产环境应为true

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none